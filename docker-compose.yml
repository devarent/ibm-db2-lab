services:
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    container_name: db2-lab
    restart: unless-stopped
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: db2inst1
      DBNAME: LAB
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    ports:
      - "127.0.0.1:50000:50000"
    volumes:
      - db2-data:/database

volumes:
  db2-data:
